[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_equality = True

[[mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = False
check_untyped_defs = False

[[mypy.overrides]]
module = "azure.*"
ignore_missing_imports = True

[[mypy.overrides]]
module = "callscore.logger"
disallow_untyped_defs = False

[[mypy.overrides]]
module = "callscore.scoring"
disallow_untyped_defs = False

[[mypy.overrides]]
module = "callscore.ingest"
disallow_untyped_defs = False

[[mypy.overrides]]
module = "callscore.functions.http_score"
disallow_untyped_defs = False

[[mypy.overrides]]
module = "callscore.functions.queue_worker"
disallow_untyped_defs = False
